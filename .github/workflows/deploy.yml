    name: CI/CD Pipeline
  
    on:
      push:
        branches: [ main ]
      workflow_dispatch:
                                                                                                      
    jobs:                                                                                             
      # ==========================================
      # STAGE 1: Automated Testing & Linting (CI)
      # ==========================================
      test:                                                                                           
        name: Run Tests & Type Checks                                                                 
        runs-on: ubuntu-latest
  
        steps:                                                                                        
          - name: Checkout Code
            uses: actions/checkout@v4
  
          # 1. Setup Backend & Run Tests
          - name: Setup Python                                                                        
            uses: actions/setup-python@v5
            with:                                                                                     
              python-version: "3.12"                                                                  
              cache: "pip"
  
          - name: Install Backend Dependencies
            run: |
              python -m pip install --upgrade pip                                                     
              pip install -r backend/requirements.txt
  
          - name: Run Backend Tests                                                                   
            run: |                                                                                    
              cd backend
              pytest tests/ -v
  
          # 2. Setup Frontend & Run Checks
          - name: Setup Node.js                                                                       
            uses: actions/setup-node@v4                                                               
            with:                                                                                     
              node-version: "20"                                                                      
              cache: "npm"
              cache-dependency-path: frontend/package-lock.json
  
          - name: Install Frontend Dependencies
            run: |
              cd frontend
              npm ci
  
          - name: Check TypeScript Types                                                              
            run: |
              cd frontend
              npx tsc --noEmit                                                                        
                                                                                                      
          - name: Run Frontend Tests                                                                  
            run: |                                                                                    
              cd frontend
              npm test
  
      # ==========================================
      # STAGE 2: Deploy to AWS EC2 (CD)
      # ==========================================
      deploy:
        name: Deploy to Production EC2
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
  
        steps:
          - name: Execute Remote SSH Commands on EC2
            uses: appleboy/ssh-action@v1.0.3
            with:
              host: ${{ secrets.EC2_HOST }}
              username: ${{ secrets.EC2_USER }}
              key: ${{ secrets.EC2_SSH_KEY }}
              script: |
                set -e
                echo "==> Pulling latest code..."
                cd /www/wwwroot/Research-assistant
                git pull origin main
  
                echo "==> Updating Python backend..."
                cd /www/wwwroot/Research-assistant/backend
                source /www/wwwroot/Research-assistant/venv/bin/activate
                pip install -r requirements.txt
                sudo systemctl restart research-backend
  
                echo "==> Building Next.js frontend..."
                cd /www/wwwroot/Research-assistant/frontend
                npm ci || npm install
                npm run build
                pm2 restart frontend
  
                echo "==> Deployment successful!"
